name: Daily data update

# 매일 1회 데이터 수집 → 변경분을 커밋한다.
# data/ 가 바뀌면 deploy 워크플로(또는 Vercel)가 자동으로 재배포한다.
on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = KST 06:00
  workflow_dispatch: {} # 수동 트리거(테스트용)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect latest model data
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: npm run build-data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): daily update ($(date -u +%Y-%m-%d))"
            git push
          fi
