name: Deploy to GitHub Pages

# main 브랜치 푸시 시, 그리고 데일리 데이터 업데이트가 끝난 뒤 정적 빌드 → GitHub Pages 배포.
# 데일리 워크플로는 기본 GITHUB_TOKEN으로 푸시하는데, 그 푸시는 무한루프 방지 정책상
# 다른 워크플로의 on:push 를 트리거하지 못한다. 그래서 workflow_run 으로 명시적으로 이어 받는다.
# Vercel을 쓸 경우 이 워크플로는 비활성화하고, Vercel이 푸시마다 자동 배포한다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily data update"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages 프로젝트 사이트는 /<repo> 하위 경로에 배포되므로 BASE_PATH 주입.
      - name: Build
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
